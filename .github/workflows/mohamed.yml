name: Echo CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check Workflow
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print message
        if: success()
        run: echo "First job passed successfully!"

  build:
    name: Build Echo Docker Image
    runs-on: ubuntu-latest
    needs: check
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Echo image
        run: docker build -t echo:latest .